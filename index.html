<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌈 Game tương tác</title>

<style>

/* =========================
   CÀI ĐẶT CHUNG
========================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family:
        "Arial",
        "Segoe UI",
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #dff5ff 0%,
            #f7fcff 45%,
            #fff8df 100%
        );

    color: #444;
}


/* =========================
   HEADER
========================= */

header {
    position: relative;
    text-align: center;

    padding:
        25px 15px 35px;

    overflow: hidden;
}


/* =========================
   MẶT TRỜI
========================= */

.sun {
    position: absolute;

    width: 90px;
    height: 90px;

    right: 7%;
    top: 25px;

    border-radius: 50%;

    background: #ffd84d;

    box-shadow:
        0 0 0 12px rgba(255,216,77,.15),
        0 0 35px rgba(255,196,0,.35);

    z-index: 0;
}


/* =========================
   CẦU VỒNG
========================= */

.rainbow {
    position: relative;

    width: min(850px, 96vw);
    height: 300px;

    margin: 0 auto;

    overflow: hidden;
}


/* từng vòng cầu vồng */

.rainbow-ring {
    position: absolute;

    left: 50%;

    transform:
        translateX(-50%);

    border-radius:
        600px 600px 0 0;

    border-style: solid;

    border-bottom: 0;
}


/* vòng ngoài */

.rainbow-1 {
    width: 850px;
    height: 360px;

    top: 45px;

    border-width: 25px;
    border-color: #ff9f43;
}


/* vòng vàng */

.rainbow-2 {
    width: 770px;
    height: 325px;

    top: 72px;

    border-width: 24px;
    border-color: #ffe36e;
}


/* vòng xanh lá */

.rainbow-3 {
    width: 690px;
    height: 290px;

    top: 98px;

    border-width: 23px;
    border-color: #91df8b;
}


/* vòng xanh */

.rainbow-4 {
    width: 610px;
    height: 255px;

    top: 124px;

    border-width: 22px;
    border-color: #65b9ef;
}


/* =========================
   MÂY
========================= */

.cloud {
    position: absolute;

    width: 190px;
    height: 55px;

    background: white;

    border-radius: 50px;

    z-index: 2;

    box-shadow:
        0 3px 8px rgba(0,0,0,.04);
}

.cloud:before,
.cloud:after {
    content: "";

    position: absolute;

    background: white;

    border-radius: 50%;
}

.cloud:before {
    width: 75px;
    height: 75px;

    left: 28px;
    bottom: 18px;
}

.cloud:after {
    width: 95px;
    height: 95px;

    right: 20px;
    bottom: 10px;
}

.cloud-left {
    left: 2%;
    bottom: 20px;
}

.cloud-right {
    right: 2%;
    bottom: 10px;
}


/* =========================
   CÂY
========================= */

.tree {
    position: absolute;

    left: 5%;
    bottom: 22px;

    font-size: 95px;

    z-index: 5;

    filter:
        drop-shadow(
            0 5px 3px rgba(0,0,0,.12)
        );
}


/* =========================
   NHÂN VẬT
========================= */

.characters {
    position: absolute;

    left: 50%;
    bottom: 3px;

    transform:
        translateX(-50%);

    display: flex;

    align-items: flex-end;

    gap: 12px;

    z-index: 6;

    font-size: 76px;

    white-space: nowrap;
}

.character {
    animation:
        bounce 3s ease-in-out infinite;
}

.character:nth-child(2) {
    animation-delay: .3s;
}

.character:nth-child(3) {
    animation-delay: .6s;
}

.character:nth-child(4) {
    animation-delay: .9s;
}


@keyframes bounce {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }

}


/* =========================
   CHIM
========================= */

.bird {
    position: absolute;

    z-index: 7;

    font-size: 48px;

    animation:
        fly 5s ease-in-out infinite;
}

.bird-1 {
    left: 34%;
    top: 95px;
}

.bird-2 {
    right: 23%;
    top: 135px;

    animation-delay: 1s;
}


@keyframes fly {

    0%,100% {
        transform:
            translate(0,0);
    }

    50% {
        transform:
            translate(18px,-10px);
    }

}


/* =========================
   TIÊU ĐỀ
========================= */

.main-title {
    position: relative;

    z-index: 10;

    margin:
        -15px 0 5px;

    font-size:
        clamp(42px, 7vw, 72px);

    font-weight: 900;

    color: #1597e5;

    text-shadow:
        3px 3px 0 #ffffff,
        6px 6px 0 rgba(0,0,0,.08);
}


.subtitle {
    position: relative;

    z-index: 10;

    max-width: 800px;

    margin:
        0 auto;

    font-size:
        clamp(17px, 2.5vw, 23px);

    line-height: 1.4;

    font-weight: 600;

    color: #666;
}


/* =========================
   KHU VỰC GAME
========================= */

.game-section {
    max-width: 1180px;

    margin:
        0 auto;

    padding:
        10px 20px 40px;
}


/* tiêu đề */

.section-title {
    text-align: center;

    margin:
        10px 0 25px;

    font-size: 30px;

    font-weight: 900;

    color: #1597e5;
}


/* =========================
   DANH SÁCH GAME
========================= */

.games {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(240px, 1fr)
        );

    gap: 25px;
}


/* =========================
   CARD GAME
========================= */

.game-card {
    position: relative;

    background: #ffffff;

    border-radius: 25px;

    padding: 15px;

    text-align: center;

    border: 4px solid #bce8ff;

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.09);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.game-card:hover {
    transform:
        translateY(-8px)
        scale(1.01);

    box-shadow:
        0 16px 30px
        rgba(0,0,0,.14);
}


/* =========================
   ICON GAME
========================= */

.game-icon {
    height: 145px;

    border-radius: 20px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 78px;

    background:
        linear-gradient(
            135deg,
            #e5f7ff,
            #f5fcff
        );

    margin-bottom: 14px;

    overflow: hidden;
}


/* =========================
   TÊN GAME
========================= */

.game-title {
    margin:
        7px 0;

    font-size: 21px;

    color: #1479b8;

    font-weight: 900;
}


/* =========================
   MÔ TẢ
========================= */

.game-description {
    min-height: 42px;

    margin:
        8px 5px 13px;

    font-size: 14px;

    line-height: 1.4;

    color: #777;
}


/* =========================
   NÚT CHƠI
========================= */

.play-button {
    display: inline-block;

    padding:
        12px 30px;

    border-radius: 30px;

    text-decoration: none;

    color: white;

    font-size: 16px;

    font-weight: 900;

    background:
        linear-gradient(
            90deg,
            #1597e5,
            #087ac7
        );

    box-shadow:
        0 5px 12px
        rgba(21,151,229,.3);

    transition:
        transform .2s;
}

.play-button:hover {
    transform:
        scale(1.07);
}


/* =========================
   MÀU CARD LUÂN PHIÊN
========================= */

.game-card:nth-child(2n) {
    border-color: #ffc7df;
}

.game-card:nth-child(2n)
.game-icon {
    background:
        linear-gradient(
            135deg,
            #fff0f7,
            #fff8fb
        );
}

.game-card:nth-child(2n)
.play-button {
    background:
        linear-gradient(
            90deg,
            #f83b79,
            #e82568
        );
}


.game-card:nth-child(3n) {
    border-color: #b8ebc1;
}

.game-card:nth-child(3n)
.game-icon {
    background:
        linear-gradient(
            135deg,
            #effff1,
            #f8fff9
        );
}

.game-card:nth-child(3n)
.play-button {
    background:
        linear-gradient(
            90deg,
            #26b95c,
            #159947
        );
}


.game-card:nth-child(4n) {
    border-color: #ffe19a;
}

.game-card:nth-child(4n)
.game-icon {
    background:
        linear-gradient(
            135deg,
            #fff9e6,
            #fffdf3
        );
}

.game-card:nth-child(4n)
.play-button {
    background:
        linear-gradient(
            90deg,
            #ffad19,
            #f28b00
        );
}


/* =========================
   LOADING
========================= */

.loading {
    grid-column:
        1 / -1;

    text-align: center;

    padding:
        55px 20px;

    font-size: 20px;

    color: #777;
}


/* =========================
   FOOTER
========================= */

footer {
    text-align: center;

    padding:
        25px 20px 45px;

    font-size: 21px;

    font-weight: 900;

    color: #1597e5;
}


/* =========================
   ĐIỆN THOẠI
========================= */

@media (max-width: 650px) {

    header {
        padding-top: 15px;
    }

    .rainbow {
        height: 230px;
    }

    .rainbow-1 {
        width: 650px;
        height: 280px;
    }

    .rainbow-2 {
        width: 580px;
        height: 250px;
    }

    .rainbow-3 {
        width: 510px;
        height: 220px;
    }

    .rainbow-4 {
        width: 440px;
        height: 190px;
    }

    .tree {
        left: 0;
        font-size: 60px;
    }

    .characters {
        font-size: 48px;
        gap: 2px;
    }

    .bird {
        font-size: 34px;
    }

    .main-title {
        margin-top: -5px;
    }

    .game-section {
        padding:
            5px 12px 30px;
    }

    .games {
        grid-template-columns:
            repeat(2, minmax(0,1fr));

        gap: 12px;
    }

    .game-card {
        padding: 9px;
        border-radius: 19px;
        border-width: 3px;
    }

    .game-icon {
        height: 105px;
        font-size: 53px;
        border-radius: 14px;
    }

    .game-title {
        font-size: 16px;
    }

    .game-description {
        font-size: 12px;
        min-height: 34px;
    }

    .play-button {
        padding:
            9px 15px;

        font-size: 13px;
    }

    .section-title {
        font-size: 24px;
    }

}


@media (max-width: 380px) {

    .games {
        grid-template-columns: 1fr;
    }

}


/* =========================
   HIỆU ỨNG SAO
========================= */

.star {
    position: absolute;

    font-size: 22px;

    z-index: 4;

    animation:
        twinkle 2s ease-in-out infinite;
}

.star-1 {
    left: 15%;
    top: 70px;
}

.star-2 {
    right: 12%;
    top: 90px;

    animation-delay: .8s;
}

.star-3 {
    left: 25%;
    top: 150px;

    animation-delay: 1.3s;
}


@keyframes twinkle {

    0%,100% {
        opacity: .4;
        transform: scale(.8);
    }

    50% {
        opacity: 1;
        transform: scale(1.2);
    }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="sun"></div>

    <div class="star star-1">✨</div>
    <div class="star star-2">⭐</div>
    <div class="star star-3">✨</div>


    <div class="rainbow">

        <div class="rainbow-ring rainbow-1"></div>
        <div class="rainbow-ring rainbow-2"></div>
        <div class="rainbow-ring rainbow-3"></div>
        <div class="rainbow-ring rainbow-4"></div>


        <div class="cloud cloud-left"></div>
        <div class="cloud cloud-right"></div>


        <div class="tree">
            🌳
        </div>


        <div class="bird bird-1">
            🐦
        </div>

        <div class="bird bird-2">
            🐦
        </div>


        <div class="characters">

            <div class="character">
                🧒🏻
            </div>

            <div class="character">
                👦🏻
            </div>

            <div class="character">
                👧🏻
            </div>

        </div>

    </div>


    <h1 class="main-title">
        Game tương tác
    </h1>


    <div class="subtitle">
        🌟 Kho trò chơi học tập và tương tác dành cho trẻ em 🌟
    </div>

</header>



<!-- =========================
     GAME
========================= -->

<section class="game-section">

    <h2 class="section-title">
        🎈 Khám phá các trò chơi 🎈
    </h2>


    <div
        id="games"
        class="games"
    >

        <div class="loading">
            ⏳ Đang tải trò chơi...
        </div>

    </div>

</section>



<footer>

    ⭐ Chúc các bé học tập vui vẻ! ⭐

</footer>



<script>

/*
============================================================
   TỰ ĐỘNG XÁC ĐỊNH GITHUB USER + REPOSITORY
============================================================

   Bạn KHÔNG CẦN sửa GITHUB_USER nữa.

   Ví dụ:

   https://2022017-droid.github.io/

   Code sẽ tự hiểu:

   USER = 2022017-droid
   REPOSITORY = 2022017-droid.github.io


   Nếu dùng:

   https://2022017-droid.github.io/Game-tuong-tac/

   Code sẽ tự hiểu:

   USER = 2022017-droid
   REPOSITORY = Game-tuong-tac

============================================================
*/


function getGitHubInfo() {

    const host =
        window.location.hostname;

    const path =
        window.location.pathname
            .split("/")
            .filter(Boolean);


    /*
    GitHub username
    */

    const user =
        host.split(".")[0];


    /*
    Repository
    */

    let repository;


    if (
        host.endsWith(
            ".github.io"
        )
    ) {

        if (path.length > 0) {

            repository =
                path[0];

        } else {

            repository =
                host;

        }

    } else {

        repository =
            path[0] || "";

    }


    return {
        user,
        repository
    };

}


/*
============================================================
   TẢI DANH SÁCH GAME
============================================================
*/

async function loadGames() {

    const gamesContainer =
        document.getElementById(
            "games"
        );


    try {

        const {
            user,
            repository
        } =
            getGitHubInfo();


        console.log(
            "GitHub User:",
            user
        );

        console.log(
            "Repository:",
            repository
        );


        if (
            !user ||
            !repository
        ) {

            throw new Error(
                "Không xác định được GitHub repository"
            );

        }


        const apiURL =
            `https://api.github.com/repos/${user}/${repository}/contents`;


        const response =
            await fetch(apiURL);


        if (!response.ok) {

            throw new Error(
                "GitHub API không phản hồi"
            );

        }


        const items =
            await response.json();


        /*
        Chỉ lấy thư mục.

        Mỗi thư mục = 1 game.
        */

        const folders =
            items.filter(
                item =>
                    item.type === "dir"
            );


        gamesContainer.innerHTML = "";


        /*
        Không có game
        */

        if (
            folders.length === 0
        ) {

            gamesContainer.innerHTML = `

                <div class="loading">

                    📺

                    <br><br>

                    Chưa có trò chơi nào.

                    <br>

                    Hãy upload game đầu tiên nhé!

                </div>

            `;

            return;

        }


        /*
        Sắp xếp theo tên
        */

        folders.sort(
            (a,b) =>
                a.name.localeCompare(
                    b.name,
                    "vi"
                )
        );


        /*
        Tạo card
        */

        folders.forEach(
            folder => {

                const name =
                    formatGameName(
                        folder.name
                    );


                const icon =
                    getGameIcon(
                        folder.name
                    );


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "game-card";


                card.innerHTML = `

                    <div class="game-icon">
                        ${icon}
                    </div>

                    <div class="game-title">
                        ${name}
                    </div>

                    <div class="game-description">
                        Trò chơi tương tác
                        dành cho trẻ em
                    </div>

                    <a
                        class="play-button"
                        href="${folder.name}/"
                    >
                        ▶ Chơi ngay
                    </a>

                `;


                gamesContainer.appendChild(
                    card
                );

            }
        );

    }


    catch (error) {

        console.error(
            error
        );


        gamesContainer.innerHTML = `

            <div class="loading">

                ⚠️

                <br><br>

                <strong>
                    Không thể tải danh sách game
                </strong>

                <br><br>

                Vui lòng kiểm tra
                repository GitHub.

            </div>

        `;

    }

}



/*
============================================================
   ĐỔI TÊN THƯ MỤC
============================================================
*/

function formatGameName(
    name
) {

    return name

        .replace(
            /[-_]/g,
            " "
        )

        .replace(
            /\b\w/g,
            letter =>
                letter.toUpperCase()
        );

}



/*
============================================================
   ICON TỰ ĐỘNG
============================================================
*/

function getGameIcon(
    name
) {

    const text =
        name
            .toLowerCase();


    if (
        text.includes("toan") ||
        text.includes("toán") ||
        text.includes("so") ||
        text.includes("so-hoc") ||
        text.includes("phep")
    ) {

        return "🔢";

    }


    if (
        text.includes("mau") ||
        text.includes("màu")
    ) {

        return "🎨";

    }


    if (
        text.includes("con-vat") ||
        text.includes("dong-vat") ||
        text.includes("động-vật") ||
        text.includes("animal")
    ) {

        return "🐶";

    }


    if (
        text.includes("chu") ||
        text.includes("chữ") ||
        text.includes("alphabet")
    ) {

        return "🔤";

    }


    if (
        text.includes("hinh") ||
        text.includes("hình") ||
        text.includes("shape")
    ) {

        return "🔷";

    }


    if (
        text.includes("am-thanh") ||
        text.includes("sound")
    ) {

        return "🎵";

    }


    if (
        text.includes("nhac") ||
        text.includes("nhạc") ||
        text.includes("music")
    ) {

        return "🎼";

    }


    if (
        text.includes("memory") ||
        text.includes("nho") ||
        text.includes("nhớ")
    ) {

        return "🧠";

    }


    if (
        text.includes("dem") ||
        text.includes("đếm") ||
        text.includes("count")
    ) {

        return "🔢";

    }


    if (
        text.includes("mau-sac") ||
        text.includes("color")
    ) {

        return "🌈";

    }


    return "🎮";

}


/*
============================================================
   CHẠY TRANG
============================================================
*/

loadGames();

</script>


</body>
</html>
