<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#dff5ff">
<title>Game tương tác</title>

<style>
:root{
  --blue:#1597e5;
  --blue-dark:#1678bb;
  --cream:#fff9e9
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:"Segoe UI","Arial",sans-serif;
  color:#24415c;
  background:linear-gradient(#dff5ff 0,#fffdf5 36%,#fff8e6 100%);
  min-height:100vh
}
.hero{
  width:100%;
  line-height:0;
  text-align:center;
  background:#dff5ff
}
.hero img{
  width:100%;
  height:auto;
  max-height:none;
  object-fit:contain;
  object-position:center;
  display:block;
  margin:0 auto
}
.section{
  max-width:1240px;
  margin:0 auto;
  padding:14px 22px 24px
}
.section-heading{
  text-align:center;
  color:var(--blue-dark);
  font-size:clamp(22px,3vw,30px);
  font-weight:900;
  margin:10px 0 22px;
  text-shadow:0 2px #fff
}
.games{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:18px
}
.game-card{
  min-width:0;
  border:2px solid #b8e5f8;
  border-radius:20px;
  padding:12px 12px 14px;
  text-align:center;
  background:linear-gradient(150deg,#effaff,#e7f7ff);
  box-shadow:0 3px 7px #24415c14;
  transition:transform .18s,box-shadow .18s;
  overflow:hidden
}
.game-card:hover{
  transform:translateY(-4px);
  box-shadow:0 9px 18px #24415c20
}
.game-card:nth-child(4n+2){
  background:linear-gradient(150deg,#fff5fa,#ffeaf3);
  border-color:#f4c4da
}
.game-card:nth-child(4n+3){
  background:linear-gradient(150deg,#f4fff1,#e9f9e5);
  border-color:#b9e4ad
}
.game-card:nth-child(4n+4){
  background:linear-gradient(150deg,#fffbed,#fff4d8);
  border-color:#f3d991
}
.thumb{
  width:100%;
  height:150px;
  display:block;
  object-fit:cover;
  border-radius:14px;
  margin-bottom:10px;
  background:#fff
}
.game-title{
  font-size:17px;
  line-height:1.28;
  font-weight:900;
  color:#164f83;
  margin:8px 0
}
.description{
  font-size:13px;
  line-height:1.4;
  color:#5d6570;
  min-height:37px;
  margin:7px 2px 12px
}
.play{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-width:145px;
  max-width:100%;
  padding:9px 18px;
  border-radius:25px;
  color:#fff;
  text-decoration:none;
  font-size:14px;
  font-weight:800;
  background:linear-gradient(90deg,#1597e5,#087dce);
  box-shadow:0 3px 7px #1597e533
}
.game-card:nth-child(4n+2) .play{
  background:linear-gradient(90deg,#f23b7a,#e71f63)
}
.game-card:nth-child(4n+3) .play{
  background:linear-gradient(90deg,#20b75a,#079b45)
}
.game-card:nth-child(4n+4) .play{
  background:linear-gradient(90deg,#ffad18,#f28a00)
}
.play:hover{filter:brightness(1.05)}
.status{
  grid-column:1/-1;
  text-align:center;
  padding:45px 15px;
  color:#737b83;
  font-size:18px;
  line-height:1.6
}
footer{
  text-align:center;
  color:#168bd0;
  font-weight:900;
  font-size:18px;
  padding:8px 12px 30px
}
@media(max-width:1000px){
  .games{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:750px){
  .games{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:13px
  }
  .section{padding:8px 14px 20px}
  .thumb{height:clamp(105px,22vw,145px)}
}
@media(max-width:420px){
  .game-card{padding:8px;border-radius:15px}
  .thumb{height:100px}
  .game-title{font-size:14px}
  .description{font-size:11px;min-height:43px}
  .play{min-width:0;padding:9px 13px;font-size:12px}
}
</style>
</head>

<body>

<header class="hero">
  <img src="banner.jpg" alt="Game tương tác - kho trò chơi học tập dành cho trẻ em">
</header>

<main class="section">
  <h2 class="section-heading">📌 Khám phá các trò chơi 📌</h2>
  <div id="games" class="games">
    <div class="status">⏳ Đang tải các trò chơi...</div>
  </div>
</main>

<footer>⭐ Chúc các bé học tập vui vẻ! ⭐</footer>

<script>
/*
  ============================================================
  TỰ ĐỘNG NHẬN DIỆN GAME + COVER
  ------------------------------------------------------------
  Cấu trúc mỗi thư mục game:

  /Ten-Game/
      index.html
      cover.jpg

  Có thể dùng:
      cover.jpg
      cover.jpeg
      cover.png
      cover.webp

  Tên thư mục game được giữ NGUYÊN, bao gồm tiếng Việt.
  ============================================================
*/

function getGitHubInfo(){
  const host = window.location.hostname;
  const parts = window.location.pathname.split("/").filter(Boolean);

  // GitHub Pages dạng:
  // username.github.io/repository/
  if(host.endsWith(".github.io")){
    const owner = host.split(".")[0];
    const repo = parts.length ? parts[0] : (host.split(".")[0] + ".github.io");
    const basePath = parts.length ? "/" + parts[0] + "/" : "/";
    return {owner, repo, basePath};
  }

  return null;
}

function escapeHTML(value){
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function encodePath(path){
  return path
    .split("/")
    .map(part => encodeURIComponent(part))
    .join("/");
}

function rawGitHubURL(owner, repo, branch, path){
  const safeBranch = encodeURIComponent(branch).replace(/%2F/g,"/");
  return "https://raw.githubusercontent.com/"
    + encodeURIComponent(owner) + "/"
    + encodeURIComponent(repo) + "/"
    + safeBranch + "/"
    + encodePath(path);
}

function pagesFileURL(basePath, folderName, fileName){
  return basePath
    + encodeURIComponent(folderName)
    + "/"
    + encodeURIComponent(fileName);
}

/*
  Tạo danh sách URL cho cover.
  Ưu tiên:
    1. download_url do GitHub API trả về
    2. raw.githubusercontent.com
    3. URL trực tiếp trên GitHub Pages

  Nhờ vậy cover vẫn hoạt động ngay cả khi một cách truy cập
  bị cache hoặc URL download của GitHub thay đổi.
*/
function makeCoverCandidates(coverFile, owner, repo, branch, basePath, folderName){
  const urls = [];

  if(coverFile && coverFile.download_url){
    urls.push(coverFile.download_url);
  }

  if(coverFile && coverFile.path){
    urls.push(rawGitHubURL(owner, repo, branch, coverFile.path));
  }

  if(coverFile && coverFile.name){
    urls.push(pagesFileURL(basePath, folderName, coverFile.name));
  }

  // Luôn thử cover.jpg cuối cùng nếu file đúng tên này tồn tại
  // nhưng GitHub API không trả download_url.
  urls.push(pagesFileURL(basePath, folderName, "cover.jpg"));

  // Loại URL trùng nhau
  return [...new Set(urls)];
}

/*
  Cho ảnh thử lần lượt nhiều URL.
  Chỉ khi TẤT CẢ URL đều lỗi mới hiện ảnh fallback.
*/
function setImageWithFallback(img, candidates, fallback){
  let index = 0;

  function tryNext(){
    if(index >= candidates.length){
      img.onerror = null;
      img.src = fallback;
      return;
    }

    const url = candidates[index++];
    img.onerror = tryNext;
    img.src = url;
  }

  tryNext();
}

function fallbackCover(title){
  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
      <defs>
        <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0" stop-color="#dff5ff"/>
          <stop offset="1" stop-color="#fff0c9"/>
        </linearGradient>
      </defs>
      <rect width="800" height="450" rx="30" fill="url(#g)"/>
      <text x="400" y="205" text-anchor="middle" font-size="92">🎮</text>
      <text x="400" y="300" text-anchor="middle"
            font-family="Arial,sans-serif" font-size="34"
            font-weight="700" fill="#1678bb">
        ${escapeHTML(title)}
      </text>
    </svg>
  `;

  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}

async function getJSON(url){
  const response = await fetch(url, {
    headers: {
      "Accept":"application/vnd.github+json"
    },
    cache:"no-store"
  });

  if(!response.ok){
    throw new Error("GitHub API " + response.status + ": " + url);
  }

  return response.json();
}

async function loadGames(){
  const container = document.getElementById("games");
  const info = getGitHubInfo();

  if(!info){
    container.innerHTML =
      '<div class="status">⚠️ Trang này cần được chạy trên GitHub Pages.</div>';
    return;
  }

  const {owner, repo, basePath} = info;

  try{
    /*
      Lấy thông tin repository để biết chính xác branch đang dùng.
      Thông thường là main.
    */
    let repoInfo = {};
    try{
      repoInfo = await getJSON(
        "https://api.github.com/repos/"
        + encodeURIComponent(owner) + "/"
        + encodeURIComponent(repo)
      );
    }catch(e){
      console.warn("Không lấy được repository metadata:", e);
    }

    const branch = repoInfo.default_branch || "main";

    // Lấy toàn bộ thư mục game ở thư mục gốc repository.
    const root = await getJSON(
      "https://api.github.com/repos/"
      + encodeURIComponent(owner) + "/"
      + encodeURIComponent(repo)
      + "/contents/"
    );

    const folders = root
      .filter(item => item.type === "dir")
      .filter(item => !item.name.startsWith("."))
      .filter(item => !["assets","css","js","images","image","img"].includes(
        item.name.toLowerCase()
      ));

    if(!folders.length){
      container.innerHTML =
        '<div class="status">🎮 Chưa tìm thấy thư mục game nào.</div>';
      return;
    }

    /*
      Đọc nội dung từng thư mục game song song.
      Mỗi thư mục chỉ cần có index.html và cover.jpg.
    */
    const games = await Promise.all(
      folders.map(async folder => {
        try{
          const files = await getJSON(folder.url);

          const indexFile = files.find(file =>
            file.type === "file" &&
            file.name.toLowerCase() === "index.html"
          );

          /*
            Nhận diện cover KHÔNG phân biệt chữ hoa/chữ thường.
            Hỗ trợ:
              cover.jpg
              cover.JPG
              cover.jpeg
              cover.PNG
              cover.webp
          */
          const coverFile = files.find(file =>
            file.type === "file" &&
            /^cover\.(jpe?g|png|webp)$/i.test(file.name)
          );

          if(!indexFile){
            return null;
          }

          const title = folder.name;

          const candidates = makeCoverCandidates(
            coverFile,
            owner,
            repo,
            branch,
            basePath,
            folder.name
          );

          /*
            Nếu GitHub API không tìm thấy coverFile, vẫn thử
            trực tiếp cover.jpg / cover.JPG / cover.jpeg...
            Điều này giúp chống lỗi do API trả về tên file bất thường.
          */
          if(!coverFile){
            const possibleNames = [
              "cover.jpg",
              "cover.JPG",
              "cover.jpeg",
              "cover.JPEG",
              "cover.png",
              "cover.PNG",
              "cover.webp",
              "cover.WEBP"
            ];

            possibleNames.forEach(name => {
              candidates.push(
                pagesFileURL(basePath, folder.name, name)
              );
            });
          }

          return {
            folderName: folder.name,
            title,
            description: "Trò chơi tương tác dành cho bé",
            url: pagesFileURL(basePath, folder.name, indexFile.name),
            coverCandidates: [...new Set(candidates)],
            coverSha: coverFile ? coverFile.sha : ""
          };

        }catch(error){
          console.warn("Không đọc được thư mục:", folder.name, error);
          return null;
        }
      })
    );

    const validGames = games.filter(Boolean);

    if(!validGames.length){
      container.innerHTML =
        '<div class="status">⚠️ Chưa tìm thấy game có file index.html.</div>';
      return;
    }

    container.innerHTML = validGames.map((game, i) => `
      <article class="game-card">
        <img
          class="thumb"
          id="cover-${i}"
          src="${fallbackCover(game.title)}"
          alt="${escapeHTML(game.title)}"
          loading="lazy"
        >

        <div class="game-title">${escapeHTML(game.title)}</div>

        <div class="description">
          ${escapeHTML(game.description)}
        </div>

        <a class="play" href="${game.url}">
          🎮 Chơi ngay
        </a>
      </article>
    `).join("");

    /*
      Sau khi tạo card, bắt đầu tải cover thật.
      Nếu cover.jpg tồn tại -> ảnh thật được hiển thị.
      Nếu không tồn tại -> fallback mới xuất hiện.
    */
    validGames.forEach((game, i) => {
      const img = document.getElementById("cover-" + i);

      if(!img) return;

      const fallback = fallbackCover(game.title);

      setImageWithFallback(
        img,
        game.coverCandidates,
        fallback
      );
    });

  }catch(error){
    console.error(error);

    container.innerHTML = `
      <div class="status">
        ⚠️ Không thể tải danh sách trò chơi.<br>
        <small>Vui lòng tải lại trang sau vài giây.</small>
      </div>
    `;
  }
}

loadGames();
</script>

</body>
</html>
