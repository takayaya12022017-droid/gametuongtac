<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#dff5ff">
<title>Game tương tác</title>

<style>
:root{
  --blue:#1597e5;
  --blue-dark:#1678bb;
  --cream:#fff9e9;
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:"Segoe UI","Arial",sans-serif;
  color:#24415c;
  background:linear-gradient(#dff5ff 0,#fffdf5 36%,#fff8e6 100%);
  min-height:100vh;
}

.hero{
  width:100%;
  line-height:0;
  text-align:center;
  background:#dff5ff;
}

.hero img{
  width:100%;
  height:auto;
  max-height:690px;
  object-fit:cover;
  object-position:center;
  display:block;
  margin:auto;
}

.section{
  max-width:1240px;
  margin:0 auto;
  padding:14px 22px 24px;
}

.section-heading{
  text-align:center;
  color:var(--blue-dark);
  font-size:clamp(22px,3vw,30px);
  font-weight:900;
  margin:10px 0 22px;
  text-shadow:0 2px #fff;
}

.games{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:18px;
}

.game-card{
  min-width:0;
  border:2px solid #b8e5f8;
  border-radius:20px;
  padding:12px 12px 14px;
  text-align:center;
  background:linear-gradient(150deg,#effaff,#e7f7ff);
  box-shadow:0 3px 7px #24415c14;
  transition:transform .18s,box-shadow .18s;
  overflow:hidden;
}

.game-card:hover{
  transform:translateY(-4px);
  box-shadow:0 9px 18px #24415c20;
}

.game-card:nth-child(4n+2){
  background:linear-gradient(150deg,#fff5fa,#ffeaf3);
  border-color:#f4c4da;
}

.game-card:nth-child(4n+3){
  background:linear-gradient(150deg,#f4fff1,#e9f9e5);
  border-color:#b9e4ad;
}

.game-card:nth-child(4n+4){
  background:linear-gradient(150deg,#fffbed,#fff4d8);
  border-color:#f3d991;
}

.thumb{
  width:100%;
  height:150px;
  display:block;
  object-fit:cover;
  border-radius:14px;
  margin-bottom:10px;
  background:#fff;
}

.game-title{
  font-size:17px;
  line-height:1.28;
  font-weight:900;
  color:#164f83;
  margin:8px 0;
}

.description{
  font-size:13px;
  line-height:1.4;
  color:#5d6570;
  min-height:37px;
  margin:7px 2px 12px;
}

.play{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-width:145px;
  max-width:100%;
  padding:9px 18px;
  border-radius:25px;
  color:#fff;
  text-decoration:none;
  font-size:14px;
  font-weight:800;
  background:linear-gradient(90deg,#1597e5,#087dce);
  box-shadow:0 3px 7px #1597e533;
}

.game-card:nth-child(4n+2) .play{
  background:linear-gradient(90deg,#f23b7a,#e71f63);
}

.game-card:nth-child(4n+3) .play{
  background:linear-gradient(90deg,#20b75a,#079b45);
}

.game-card:nth-child(4n+4) .play{
  background:linear-gradient(90deg,#ffad18,#f28a00);
}

.play:hover{
  filter:brightness(1.05);
}

.status{
  grid-column:1/-1;
  text-align:center;
  padding:45px 15px;
  color:#737b83;
  font-size:18px;
  line-height:1.6;
}

footer{
  text-align:center;
  color:#168bd0;
  font-weight:900;
  font-size:18px;
  padding:8px 12px 30px;
}

@media(max-width:1000px){
  .games{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(max-width:750px){
  .games{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:13px;
  }

  .section{
    padding:8px 14px 20px;
  }

  .thumb{
    height:clamp(105px,22vw,145px);
  }
}

@media(max-width:420px){
  .game-card{
    padding:8px;
    border-radius:15px;
  }

  .thumb{
    height:100px;
  }

  .game-title{
    font-size:14px;
  }

  .description{
    font-size:11px;
    min-height:43px;
  }

  .play{
    min-width:0;
    padding:9px 13px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<header class="hero">
  <img src="banner.jpg"
       alt="Game tương tác - kho trò chơi học tập dành cho trẻ em">
</header>

<main class="section">
  <h2 class="section-heading">📌 Khám phá các trò chơi 📌</h2>

  <div id="games" class="games">
    <div class="status">⏳ Đang tải các trò chơi...</div>
  </div>
</main>

<footer>⭐ Chúc các bé học tập vui vẻ! ⭐</footer>

<script>
/*
  ============================================================
  GAME TƯƠNG TÁC - INDEX CHÍNH
  ============================================================

  Mỗi game chỉ cần đặt trong một thư mục riêng:

      /Ten Game/
          index.html
          cover.jpg

  Ví dụ:

      /Be Vui Hoc Dem 1 3/
          index.html
          cover.jpg

      /Bé Vui Học Toán Tìm Hình Tam Giác/
          index.html
          cover.jpg

  QUAN TRỌNG:
  - Tên game hiển thị đúng nguyên văn tên thư mục.
  - Không tự đổi chữ hoa/thường.
  - Không làm mất dấu tiếng Việt.
  - cover.jpg được lấy trực tiếp từ chính thư mục game.
*/

const gamesContainer = document.getElementById("games");

/*
  Lấy owner + repository từ địa chỉ GitHub Pages.

  Ví dụ:
  https://takayaya12022017-droid.github.io/gametuongtac/

  => owner = takayaya12022017-droid
  => repo  = gametuongtac
  => base  = /gametuongtac/
*/
function getGitHubInfo(){
  const host = window.location.hostname;
  const pathParts = window.location.pathname
    .split("/")
    .filter(Boolean);

  if(!host.endsWith(".github.io")){
    throw new Error("Trang này cần được chạy trên GitHub Pages.");
  }

  const owner = host.substring(0, host.length - ".github.io".length);

  if(!owner){
    throw new Error("Không xác định được tên tài khoản GitHub.");
  }

  const repo = pathParts.length > 0
    ? pathParts[0]
    : owner + ".github.io";

  const basePath = pathParts.length > 0
    ? "/" + pathParts[0] + "/"
    : "/";

  return {
    owner,
    repo,
    basePath
  };
}

/*
  Giữ nguyên 100% tên folder.
  Không dùng \b\w vì \w không xử lý Unicode tiếng Việt đúng.
*/
function displayName(folderName){
  return String(folderName)
    .replace(/\s+/g, " ")
    .trim();
}

/*
  Chống HTML injection khi đưa tên folder vào giao diện.
*/
function escapeHTML(value){
  return String(value).replace(/[&<>"']/g, function(char){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char];
  });
}

/*
  Ảnh dự phòng nếu game chưa có cover.jpg.
*/
function fallbackCover(title){
  const safeTitle = escapeHTML(title);

  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg"
         width="900"
         height="600"
         viewBox="0 0 900 600">

      <defs>
        <linearGradient id="bg"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1">
          <stop offset="0%" stop-color="#dff5ff"/>
          <stop offset="100%" stop-color="#fff0c9"/>
        </linearGradient>
      </defs>

      <rect width="900"
            height="600"
            rx="35"
            fill="url(#bg)"/>

      <text x="450"
            y="265"
            text-anchor="middle"
            font-size="105">
        🎮
      </text>

      <text x="450"
            y="370"
            text-anchor="middle"
            font-family="Arial, sans-serif"
            font-size="34"
            font-weight="bold"
            fill="#1678bb">
        ${safeTitle}
      </text>
    </svg>
  `;

  return "data:image/svg+xml;charset=UTF-8,"
       + encodeURIComponent(svg);
}

/*
  Encode từng phần của đường dẫn.

  encodeURIComponent() giúp tên folder tiếng Việt,
  khoảng trắng và ký tự đặc biệt hoạt động đúng trên URL.
*/
function makeGameURL(basePath, folderName){
  return basePath
       + encodeURIComponent(folderName)
       + "/";
}

/*
  Encode đường dẫn tới cover.jpg.

  Đây là điểm sửa quan trọng:
  KHÔNG lấy download_url từ GitHub API nữa.

  Trang chủ sẽ trực tiếp lấy:

      /Tên folder/cover.jpg

  nên chắc chắn dùng đúng ảnh cover bạn upload.
*/
function makeCoverURL(basePath, folderName){
  return basePath
       + encodeURIComponent(folderName)
       + "/cover.jpg";
}

/*
  Tải danh sách game từ GitHub Contents API.
*/
async function loadGames(){

  try{

    const {
      owner,
      repo,
      basePath
    } = getGitHubInfo();

    /*
      Lấy danh sách ở thư mục gốc repository.
    */
    const rootURL =
      "https://api.github.com/repos/"
      + encodeURIComponent(owner)
      + "/"
      + encodeURIComponent(repo)
      + "/contents/";

    const response = await fetch(
      rootURL,
      {cache:"no-store"}
    );

    if(!response.ok){

      throw new Error(
        "GitHub API trả về mã lỗi "
        + response.status
        + "."
      );
    }

    const items = await response.json();

    /*
      Chỉ lấy folder.
      Bỏ qua các folder hệ thống.
    */
    const folders = items.filter(function(item){

      return item.type === "dir"
        && ![
          ".github",
          ".git",
          "assets",
          "node_modules"
        ].includes(item.name);

    });

    gamesContainer.innerHTML = "";

    if(!folders.length){

      gamesContainer.innerHTML =
        '<div class="status">'
        + '📺 Chưa tìm thấy thư mục game nào.<br>'
        + 'Mỗi game cần có thư mục riêng, bên trong có '
        + '<b>index.html</b> và <b>cover.jpg</b>.'
        + '</div>';

      return;
    }

    const games = [];

    /*
      Kiểm tra từng folder.
    */
    for(const folder of folders){

      try{

        const folderURL =
          "https://api.github.com/repos/"
          + encodeURIComponent(owner)
          + "/"
          + encodeURIComponent(repo)
          + "/contents/"
          + encodeURIComponent(folder.name);

        const folderResponse = await fetch(
          folderURL,
          {cache:"no-store"}
        );

        if(!folderResponse.ok){
          continue;
        }

        const files = await folderResponse.json();

        /*
          Game hợp lệ phải có index.html.
        */
        const indexFile = files.find(function(file){

          return file.type === "file"
            && file.name.toLowerCase() === "index.html";

        });

        if(!indexFile){
          continue;
        }

        /*
          Kiểm tra cover.jpg.

          Chấp nhận cả:
            cover.jpg
            COVER.JPG
            Cover.Jpg

          nhưng đường dẫn thực tế vẫn được tạo
          theo tên file chuẩn cover.jpg.
        */
        const coverFile = files.find(function(file){

          return file.type === "file"
            && file.name.toLowerCase() === "cover.jpg";

        });

        const name = displayName(folder.name);

        /*
          Nếu có cover.jpg:
          lấy trực tiếp cover.jpg trong folder.

          Nếu không có:
          dùng ảnh dự phòng.
        */
        const cover = coverFile
          ? makeCoverURL(basePath, folder.name)
          : fallbackCover(name);

        const url =
          makeGameURL(basePath, folder.name);

        games.push({
          name:name,
          cover:cover,
          url:url,
          hasCover:!!coverFile
        });

      }catch(error){

        console.warn(
          "Không thể đọc folder:",
          folder.name,
          error
        );

      }
    }

    /*
      Sắp xếp theo tiếng Việt.
      Intl.Collator giúp sắp xếp Unicode tiếng Việt tốt hơn.
    */
    const vietnameseCollator =
      new Intl.Collator("vi", {
        sensitivity:"base",
        numeric:true
      });

    games.sort(function(a,b){
      return vietnameseCollator.compare(
        a.name,
        b.name
      );
    });

    if(!games.length){

      gamesContainer.innerHTML =
        '<div class="status">'
        + '⚠️ Không tìm thấy game hợp lệ.<br>'
        + 'Mỗi thư mục game cần có <b>index.html</b>.'
        + '</div>';

      return;
    }

    /*
      Hiển thị từng game.
    */
    games.forEach(function(game){

      const card =
        document.createElement("article");

      card.className = "game-card";

      const title =
        escapeHTML(game.name);

      card.innerHTML = `
        <img
          class="thumb"
          src="${game.cover}"
          alt="${title}"
          loading="lazy"
        >

        <div class="game-title">
          ${title}
        </div>

        <div class="description">
          🎈 Trò chơi học tập tương tác giúp bé vừa học vừa vui.
        </div>

        <a
          class="play"
          href="${game.url}"
        >
          ▶ Chơi ngay
        </a>
      `;

      /*
        Nếu cover.jpg bị lỗi:
        tự chuyển sang ảnh dự phòng.
      */
      const image =
        card.querySelector(".thumb");

      image.addEventListener(
        "error",
        function(){

          if(this.dataset.fallbackUsed){
            return;
          }

          this.dataset.fallbackUsed = "1";
          this.src = fallbackCover(game.name);

        }
      );

      gamesContainer.appendChild(card);

    });

  }catch(error){

    console.error(error);

    gamesContainer.innerHTML =
      '<div class="status">'
      + '⚠️ Không tải được danh sách trò chơi.<br><br>'
      + escapeHTML(error.message)
      + '<br><br>'
      + '<small>'
      + 'Hãy kiểm tra repository đang Public '
      + 'và GitHub Pages đang hoạt động.'
      + '</small>'
      + '</div>';
  }
}

loadGames();
</script>

</body>
</html>
