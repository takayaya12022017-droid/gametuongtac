<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#fff8e8">
<title>Chạm biến mất – Nhận biết to nhỏ</title>
<style>
:root{--ink:#33415c;--pink:#ff7a90;--yellow:#ffd166;--blue:#78c8e8;--green:#76c893;--paper:#fffdf7}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'Times New Roman',Times,serif;color:var(--ink);background:radial-gradient(circle at 15% 15%,#fff 0 5px,transparent 6px),linear-gradient(135deg,#fff8e8,#f3fbff 60%,#fff0f3);background-size:42px 42px,auto}button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #4f9fc2;outline-offset:3px}.app{max-width:1000px;margin:auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}.topline{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.06em;color:#f06b84}.iconbtn{background:#fff;border:2px solid #f2e7d1;border-radius:50%;width:48px;height:48px;font-size:23px;box-shadow:0 4px 0 #eadfc9}.screen{flex:1;display:none;align-items:center;justify-content:center;text-align:center;padding:16px 4px 28px}.screen.active{display:flex}.card{width:min(100%,760px);background:rgba(255,255,255,.86);border:3px solid white;border-radius:34px;padding:clamp(22px,5vw,48px);box-shadow:0 12px 0 #eadfc9,0 20px 40px #57657a18}.hero{font-size:clamp(3rem,12vw,6.5rem);margin:0;line-height:1.05;color:#f06b84;text-shadow:0 5px #ffd9df}.subtitle{font-size:clamp(1.1rem,3vw,1.5rem);margin:14px 0 26px}.mascot{font-size:clamp(4rem,14vw,7rem);margin:10px}.btn{border-radius:20px;padding:16px 24px;font-weight:900;font-size:1.12rem;box-shadow:0 6px 0 #00000018;transition:transform .12s,box-shadow .12s}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #00000018}.primary{background:var(--pink);color:#fff}.blue{background:var(--blue)}.yellow{background:var(--yellow)}.green{background:var(--green);color:#173f2d}.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}.choice{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:min(100%,250px);flex:1}.choice .btn{width:100%;min-height:112px;background:#fff4cc;border:3px solid #ffe08a}.choice:nth-child(2) .btn{background:#e5f6ff;border-color:#aee3f6}.choice b{font-size:1.25rem}.round-title{font-size:clamp(2rem,7vw,3.5rem);margin:0 0 8px}.instruction{font-size:1.25rem;margin:8px 0 18px}.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.hud .round-title{font-size:clamp(1.3rem,4vw,2rem);margin:0;text-align:left}.count{font-weight:900;background:#fff;border-radius:999px;padding:10px 16px;white-space:nowrap}.progress{height:14px;background:#ece9df;border-radius:99px;overflow:hidden;margin:14px 0 22px}.bar{height:100%;width:0;background:linear-gradient(90deg,#79d7b2,#ffd166);border-radius:99px;transition:width .35s}.prompt{font-size:clamp(1.3rem,4vw,2rem);font-weight:900;margin:8px 0 20px}.objects{display:flex;align-items:center;justify-content:center;gap:clamp(12px,7vw,70px);min-height:300px}.object{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#fff;border:4px solid #f3ead7;border-radius:30px;width:min(39vw,270px);height:clamp(180px,38vw,280px);box-shadow:0 8px 0 #eee4d0;transition:transform .2s,border-color .2s,opacity .2s;position:relative}.object:hover{transform:translateY(-4px)}.object{background:linear-gradient(145deg,#fff 5%,#fffdf4 62%,#f6ebd8);box-shadow:0 9px 0 #dfd2ba,0 15px 22px #49566b25,inset 0 3px 8px #ffffff}.object:before{content:"";position:absolute;inset:8px;border-radius:23px;background:linear-gradient(135deg,#ffffffa8,transparent 42%);pointer-events:none}.object .illustration,.object .label{position:relative;z-index:1}.object .illustration{display:block;background-image:url("assets/items.png");background-repeat:no-repeat;background-size:500% 600%;background-position:var(--sprite-x) var(--sprite-y);filter:drop-shadow(0 8px 5px #28344b35);transition:transform .18s}.object.big .illustration{width:clamp(125px,22vw,190px);height:clamp(125px,22vw,190px)}.object.small .illustration{width:clamp(78px,13vw,115px);height:clamp(78px,13vw,115px)}.object .label{font-weight:800;font-size:1rem;color:#68758b}.object.correct{animation:poof .65s forwards;border-color:#76c893}.feedback{height:34px;font-weight:900;font-size:1.12rem;color:#31936d;margin:12px 0}.footer{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.smallbtn{padding:11px 17px;border-radius:15px;background:#f0f5f7;font-weight:800}.badge{display:inline-block;padding:13px 20px;background:#fff0ad;border-radius:999px;font-weight:900;margin:16px}.starburst{font-size:2rem;letter-spacing:12px;animation:bob 1s infinite alternate}.hidden{display:none!important}.overlay{position:fixed;inset:0;background:#24344b77;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}.overlay .card{max-width:520px}.overlay h2{font-size:2rem}.overlay .row{margin-top:20px}@keyframes poof{50%{transform:scale(1.18) rotate(8deg);opacity:.8}100%{transform:scale(.1) translateY(-80px);opacity:0}}@keyframes bob{to{transform:translateY(-9px)}}@media(max-width:560px){.app{padding:12px}.objects{min-height:240px;gap:10px}.object{width:44vw;height:220px;border-radius:22px}.hud{align-items:flex-start}.hud .round-title{max-width:60%}.card{border-radius:26px}.btn{font-size:1rem;padding:14px 18px}}
</style>
</head>
<body><main class="app"><header class="topline"><div class="brand">🌈 BÉ HỌC MỖI NGÀY</div><button class="iconbtn" id="soundBtn" aria-label="Bật tắt âm thanh" title="Bật/tắt âm thanh">🔊</button></header>
<section id="home" class="screen active"><div class="card"><div class="mascot" aria-hidden="true">🐰 ⚽</div><h1 class="hero">CHẠM<br>BIẾN MẤT</h1><p class="subtitle">Bé cùng tìm đồ vật <b>to</b> và <b>nhỏ</b> nhé!</p><button class="btn primary" id="startBtn">BẮT ĐẦU ✨</button></div></section>
<section id="choose" class="screen"><div class="card"><h2 class="round-title">BÉ MUỐN CHƠI VÒNG NÀO?</h2><p class="subtitle">Mỗi vòng có 15 lượt chơi thật vui!</p><div class="row"><div class="choice"><div class="mascot">🐘</div><button class="btn" data-round="big"><b>VÒNG 1</b><br>CÁI NÀO TO?</button></div><div class="choice"><div class="mascot">🐭</div><button class="btn" data-round="small"><b>VÒNG 2</b><br>CÁI NÀO NHỎ?</button></div></div><p style="margin-top:24px"><button class="smallbtn" data-home>⌂ Màn hình đầu</button></p></div></section>
<section id="game" class="screen"><div class="card"><div class="hud"><h2 class="round-title" id="roundName"></h2><div class="row" style="align-items:center;gap:8px"><span class="count" id="count">Lượt 1/15</span><button class="smallbtn" id="pauseBtn">⏸ Tạm dừng</button></div></div><div class="progress"><div class="bar" id="bar"></div></div><p class="instruction" id="instruction"></p><p class="prompt" id="prompt"></p><div class="objects" id="objects"></div><div class="feedback" id="feedback" aria-live="polite"></div></div></section>
<section id="finish" class="screen"><div class="card"><div class="starburst">🌟 🎉 🌟</div><div class="mascot" id="finishMascot">🏆</div><h2 class="round-title" id="finishTitle">Hoan hô!</h2><p class="subtitle" id="finishText"></p><div class="badge" id="badge">🏅 BÉ QUAN SÁT GIỎI</div><div class="row" id="finishActions"></div></div></section>
</main><div class="overlay hidden" id="pause"><div class="card"><div class="mascot">⏸️</div><h2>NGHỈ MỘT CHÚT NHÉ!</h2><div class="row"><button class="btn green" id="resumeBtn">TIẾP TỤC</button><button class="btn yellow" id="restartBtn">CHƠI LẠI VÒNG NÀY</button><button class="btn primary" data-home>VỀ MÀN HÌNH CHÍNH</button></div></div></div>
<script>
const rounds={big:{title:'CÁI NÀO TO?',instruction:'Con hãy chạm vào đồ vật TO hơn nhé!',question:'Cái nào to hơn?',items:[['⚽','quả bóng'],['🍎','quả táo'],['🐟','con cá'],['🚗','ô tô đồ chơi'],['🌼','bông hoa'],['🐰','con thỏ'],['🥤','chiếc cốc'],['🍌','quả chuối'],['🍃','chiếc lá'],['🐘','con voi'],['⭐','ngôi sao'],['🍰','chiếc bánh'],['✈️','máy bay'],['🍉','quả dưa hấu'],['🧸','gấu bông']]},small:{title:'CÁI NÀO NHỎ?',instruction:'Con hãy chạm vào đồ vật NHỎ hơn nhé!',question:'Cái nào nhỏ hơn?',items:[['👟','chiếc giày'],['🦋','con bướm'],['🍊','quả cam'],['⛵','chiếc thuyền'],['🍄','cây nấm'],['🐱','con mèo'],['🥄','chiếc thìa'],['🍓','quả dâu'],['🥁','chiếc trống'],['🦆','con vịt'],['🪣','cái xô'],['🍦','cây kem'],['👒','chiếc mũ'],['🎈','bóng bay'],['🦕','khủng long đồ chơi']]}};
let roundKey='',index=0,answered=false,sound=true,completed=new Set(),nextTimer=null;const $=id=>document.getElementById(id);function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id))}
let audioCtx;function ctx(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}function clap(){if(!sound)return;const c=ctx();for(let i=0;i<4;i++){const n=c.createBufferSource(),b=c.createBuffer(1,c.sampleRate*.075,c.sampleRate),d=b.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*(1-j/d.length);n.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1200+Math.random()*700;const g=c.createGain();g.gain.setValueAtTime(.0001,c.currentTime+i*.11);g.gain.exponentialRampToValueAtTime(.24,c.currentTime+i*.11+.008);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+i*.11+.07);n.connect(f);f.connect(g);g.connect(c.destination);n.start(c.currentTime+i*.11)}}function wrongBeep(){if(!sound)return;const c=ctx(),o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(850,c.currentTime);o.frequency.exponentialRampToValueAtTime(430,c.currentTime+.24);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.13,c.currentTime+.025);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.27);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.28)}function startRound(key){clearTimeout(nextTimer);roundKey=key;index=0;answered=false;show('game');render()}function render(){const r=rounds[roundKey];answered=false;$('roundName').textContent=r.title;$('instruction').textContent=r.instruction;$('prompt').textContent=r.question;$('count').textContent=`Lượt ${index+1}/15`;$('bar').style.width=`${index/15*100}%`;$('feedback').textContent='';const [emoji,name]=r.items[index];const sprite=roundKey==='big'?index:index+15;const sx=(sprite%5)*25;const sy=Math.floor(sprite/5)*20;const bigOnLeft=Math.random()<.5;const opts=bigOnLeft?[true,false]:[false,true];$('objects').innerHTML=opts.map((isBig,i)=>`<button class="object ${isBig?'big':'small'}" data-correct="${(roundKey==='big'&&isBig)||(roundKey==='small'&&!isBig)}" aria-label="${name} ${isBig?'to':'nhỏ'}"><span class="illustration" style="--sprite-x:${sx}%;--sprite-y:${sy}%" aria-hidden="true"></span><span class="label">${name}</span></button>`).join('');$('objects').querySelectorAll('.object').forEach(b=>b.addEventListener('click',()=>choose(b)));}function choose(btn){if(answered)return;if(btn.dataset.correct==='true'){answered=true;btn.classList.add('correct');$('feedback').textContent='Đúng rồi, con giỏi lắm! 🌟';clap();$('bar').style.width=`${(index+1)/15*100}%`;nextTimer=setTimeout(()=>{index++;if(index>=15)finishRound();else render()},1000)}else{$('feedback').textContent='Con thử nhìn lại nhé! 😊';wrongBeep()}}function finishRound(){completed.add(roundKey);show('finish');const both=completed.size===2;$('finishMascot').textContent=both?'🏆':'🎉';$('finishTitle').textContent=both?'TUYỆT VỜI!':'HOAN HÔ!';$('finishText').textContent=both?'Con thật tuyệt! Con đã biết phân biệt đồ vật to và nhỏ rồi!':roundKey==='big'?'Con đã tìm được những đồ vật TO!':'Con đã tìm được những đồ vật NHỎ!';$('badge').classList.toggle('hidden',!both);const actions=$('finishActions');actions.innerHTML='';if(both){actions.innerHTML='<button class="btn primary" id="playAgain">CHƠI LẠI 🔄</button><button class="btn blue" data-home>VỀ MÀN HÌNH CHÍNH</button>';document.getElementById('playAgain').onclick=()=>{completed.clear();show('choose')}}else{const other=roundKey==='big'?'small':'big';actions.innerHTML=`<button class="btn green" id="otherRound">CHƠI VÒNG CÒN LẠI ➜</button><button class="btn yellow" id="repeatRound">CHƠI LẠI VÒNG NÀY</button><button class="btn blue" data-home>VỀ MÀN HÌNH CHÍNH</button>`;document.getElementById('otherRound').onclick=()=>startRound(other);document.getElementById('repeatRound').onclick=()=>startRound(roundKey)}}
$('startBtn').onclick=()=>show('choose');document.querySelectorAll('[data-round]').forEach(b=>b.onclick=()=>startRound(b.dataset.round));$('pauseBtn').onclick=()=>{$('pause').classList.remove('hidden');};$('resumeBtn').onclick=()=>$('pause').classList.add('hidden');$('restartBtn').onclick=()=>{$('pause').classList.add('hidden');startRound(roundKey)};$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent=sound?'🔊':'🔇';};document.addEventListener('click',e=>{if(e.target.closest('[data-home]')){$('pause').classList.add('hidden');clearTimeout(nextTimer);show('home')}});
</script></body></html>
