<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bé vui học toán – Số 1 và nhiều</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Trebuchet MS',Arial,sans-serif;color:#183b72;background:#8bd9ff}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.world{min-height:100vh;position:relative;overflow:hidden;background:linear-gradient(#65c9ff 0%,#d4f5ff 53%,#b8e98d 54%,#7dc85d 100%);padding:15px 18px 28px}.world:before{content:'🌳';position:absolute;left:-15px;top:120px;font-size:140px;filter:drop-shadow(0 8px 3px #4e8c4b55)}.world:after{content:'🌳';position:absolute;right:-15px;top:145px;font-size:130px;filter:drop-shadow(0 8px 3px #4e8c4b55)}.sun{position:absolute;right:8%;top:15px;font-size:74px;filter:drop-shadow(0 5px 2px #dca43e55);animation:bob 3s ease-in-out infinite}.cloud{position:absolute;top:95px;font-size:48px;opacity:.9}.c1{left:5%}.c2{right:6%;top:180px}.shell{position:relative;z-index:1;max-width:1250px;margin:auto}.top{display:grid;grid-template-columns:90px 1fr 90px;gap:12px;align-items:center}.round-info{justify-self:center;background:linear-gradient(#ffe7ad,#ffc96b);border:4px solid #fff;border-radius:20px;padding:9px 17px;box-shadow:0 6px 0 #c98b42;text-align:center;font-weight:900;font-size:17px}.round-info .dots{display:flex;gap:5px;margin-top:7px}.dot{width:13px;height:13px;border-radius:50%;background:#e6e6e6;border:2px solid #fff}.dot.done{background:#72d77a}.dot.current{background:#ffb92f}.round-info{order:0}.brand{grid-column:2;grid-row:1;text-align:center;background:linear-gradient(#e8a85e,#b66d36);border:5px solid #fff0c4;border-radius:24px;padding:9px 14px;box-shadow:0 7px 0 #9e592e, inset 0 3px #fff7d9}.brand h1{margin:0;font-size:clamp(27px,4.2vw,48px);line-height:1.05;color:#fff;text-shadow:0 4px 0 #a85a32,0 6px 7px #77401e66;letter-spacing:1px}.brand p{margin:8px 0 0;color:#21633e;font-size:clamp(14px,2.2vw,23px);font-weight:900;text-shadow:0 2px #fff}.icon{width:68px;height:68px;border:5px solid white;border-radius:50%;font-size:31px;background:linear-gradient(#ffdc73,#ff9f28);box-shadow:0 6px 0 #c87927;justify-self:center}.main{display:grid;grid-template-columns:minmax(100px,.65fr) minmax(0,2.2fr) minmax(100px,.65fr);gap:15px;align-items:end;margin-top:22px}.kid{font-size:clamp(80px,11vw,140px);text-align:center;filter:drop-shadow(0 9px 3px #35643b55);animation:bob 2.7s ease-in-out infinite;align-self:center}.kid small{display:block;font-size:15px;color:#215c3d;font-weight:900;background:#fff9df;border:3px solid white;border-radius:18px;padding:8px 4px;box-shadow:0 4px #c7a45b}.board{background:linear-gradient(145deg,#fff,#fff8eb);border:8px solid #ffcf45;border-radius:38px;padding:17px 22px 20px;box-shadow:0 10px 0 #d99b29,0 18px 30px #3b7d8a55;min-width:0}.question{display:inline-block;position:relative;left:50%;transform:translateX(-50%);white-space:nowrap;max-width:100%;background:linear-gradient(#fff3ff,#ffc8ee);border:4px solid #fff;border-radius:30px;padding:10px 24px;color:#15366c;font-size:clamp(18px,3vw,32px);font-weight:1000;text-align:center;box-shadow:0 4px 0 #e6a1d5}.question strong{color:#f33249;font-size:1.25em;text-shadow:0 2px white}.picture{height:clamp(220px,34vh,340px);margin:14px 0 17px;border:4px solid #f3d5a4;border-radius:25px;background:radial-gradient(ellipse at center,#fff 0%,#fffdf6 65%,#f6ead4 100%);display:flex;align-items:center;justify-content:center;align-content:center;flex-wrap:wrap;gap:clamp(8px,2vw,24px);padding:20px;box-shadow:inset 0 3px 9px #b5a17b33;overflow:hidden}.item{font-size:clamp(55px,7.5vw,95px);line-height:1;filter:drop-shadow(0 7px 3px #72563c3b);animation:pop .35s both;user-select:none}.answers{display:grid;grid-template-columns:1fr 1fr;gap:20px}.answer{border:5px solid white;border-radius:27px;min-height:112px;display:flex;align-items:center;justify-content:center;gap:14px;font-size:clamp(22px,3.2vw,36px);font-weight:1000;box-shadow:0 8px 0 #a6b9c6,0 12px 18px #3c6d7a33;transition:transform .12s}.answer:active{transform:translateY(5px);box-shadow:0 3px 0 #a6b9c6}.one{background:linear-gradient(145deg,#ffb9d0,#ff6f9e);color:#e92349;text-shadow:0 2px white}.many{background:linear-gradient(145deg,#b3ecff,#54bff3);color:#0757a5;text-shadow:0 2px white}.answer .symbol{font-size:clamp(38px,5vw,65px);line-height:1}.feedback{margin-top:14px;min-height:43px;text-align:center;font-size:clamp(16px,2vw,21px);font-weight:1000;color:#2c794f}.bottom{display:flex;justify-content:center;gap:14px;margin-top:18px}.restart{border:4px solid white;border-radius:18px;padding:11px 23px;background:linear-gradient(#ffe58d,#ffb83c);box-shadow:0 5px #c98529;color:#74431d;font-weight:1000}.sound-note{font-size:13px;text-align:center;color:#275a3d;font-weight:800;margin-top:9px}.overlay{position:fixed;inset:0;z-index:10;background:#16466eb8;display:grid;place-items:center;padding:18px}.overlay[hidden]{display:none}.card{width:min(100%,480px);text-align:center;border:7px solid white;border-radius:32px;padding:30px 22px;background:linear-gradient(160deg,#fff6ce,#fff 65%,#c8f4ff);box-shadow:0 12px 0 #4ea8bd}.card h2{color:#dc5d59;font-size:30px;margin:8px 0}.card p{font-weight:900;font-size:20px;line-height:1.4;margin:12px 0 22px}.stars{font-size:44px}.hidden{display:none}@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@media(max-width:780px){.world{padding:10px}.top{grid-template-columns:55px 1fr 55px;gap:7px}.icon{width:50px;height:50px;font-size:22px}.round-info{display:none}.brand{grid-column:2}.main{grid-template-columns:1fr;gap:8px;margin-top:18px}.kid{display:none}.board{padding:13px;border-width:5px;border-radius:25px}.picture{height:230px}.answers{gap:10px}.answer{min-height:88px;border-radius:20px}.sun{font-size:50px;right:2%;top:6px}.cloud{display:none}}@media(max-width:430px){.brand h1{font-size:25px}.brand p{font-size:13px}.question{white-space:normal;padding:8px 12px}.picture{height:210px;padding:12px}.item{font-size:57px}.answer{gap:6px;flex-direction:column;font-size:22px;min-height:94px}.answer .symbol{font-size:36px}}
</style></head><body><div class="world"><div class="sun">☀️</div><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="shell"><header class="top"><button class="icon" id="home" title="Về đầu trò chơi">🏠</button><div class="brand"><h1>BÉ VUI HỌC TOÁN</h1><p>🌟 Cùng khám phá: <b>SỐ 1 VÀ NHIỀU!</b> 🌟</p></div><button class="icon" id="sound" title="Bật/tắt âm thanh">🔊</button></header><main class="main"><div class="kid">👧🏻<small>Bé quan sát nhé!</small></div><section class="board"><div class="question">Có <strong>1</strong> hay có <span style="color:#0878d1">NHIỀU</span>?</div><div class="picture" id="picture" aria-label="Hình ảnh cần quan sát"></div><div class="answers"><button class="answer one" data-answer="one"><span class="symbol">☝🏻</span><span>SỐ 1</span></button><button class="answer many" data-answer="many"><span class="symbol">🖐🏻</span><span>NHIỀU</span></button></div><div class="feedback" id="feedback" role="status" aria-live="polite">Cùng chơi nào, bé ơi! 🌈</div><div class="bottom"><button class="restart" id="restart">↻ CHƠI LẠI</button></div><div class="sound-note">Chọn đáp án đúng để nghe tiếng vỗ tay cổ vũ nhé! 👏</div></section><div class="kid">👦🏻<small>Bé làm giỏi lắm!</small></div></main></div></div><div class="overlay" id="finish" hidden><div class="card"><div class="stars">⭐🌟⭐</div><h2>CHÚC MỪNG BÉ!</h2><p>Con đã hoàn thành trò chơi<br>nhận biết SỐ 1 VÀ NHIỀU!</p><button class="restart" id="again">CHƠI LẠI NÀO!</button></div></div>
<script>
(()=>{const rounds=[['🍎',3,'nhiều quả táo'],['🦆',1,'một chú vịt'],['🌸',5,'nhiều bông hoa'],['⚽',1,'một quả bóng'],['🐥',4,'nhiều vịt con'],['🎈',1,'một quả bóng bay'],['⭐',6,'nhiều ngôi sao'],['🍓',1,'một quả dâu']];let index=0,score=0,soundOn=true,ctx;const picture=document.getElementById('picture'),feedback=document.getElementById('feedback'),finish=document.getElementById('finish');function render(){let [emoji,count]=rounds[index];picture.innerHTML='';for(let i=0;i<count;i++){let s=document.createElement('span');s.className='item';s.textContent=emoji;s.style.animationDelay=(i*.05)+'s';picture.appendChild(s)}document.querySelector('.round-info')?.remove();feedback.textContent='Con nhìn thật kỹ rồi chọn nhé! 👀';}function audio(freq,dur,type='sine',delay=0){if(!soundOn)return;try{ctx ||=new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,ctx.currentTime+delay);g.gain.exponentialRampToValueAtTime(.14,ctx.currentTime+delay+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+delay+dur);o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+delay);o.stop(ctx.currentTime+delay+dur+.02)}catch(e){}}function clap(){if(!soundOn)return;audio(900,.09,'triangle');audio(1200,.09,'triangle',.1);audio(1500,.15,'triangle',.2)}function sad(){audio(250,.25,'sawtooth');audio(190,.3,'sawtooth',.22)}document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{let correct=(rounds[index][1]===1?'one':'many')===b.dataset.answer;if(correct){score++;feedback.textContent='👏 Giỏi lắm! Con chọn đúng rồi!';feedback.style.color='#21864c';clap();setTimeout(()=>{index++;if(index>=rounds.length){finish.hidden=false;audio(880,.3,'triangle');}else render()},900)}else{feedback.textContent='💛 Con thử quan sát lại nhé!';feedback.style.color='#c64b52';sad()}}));function reset(){index=0;score=0;finish.hidden=true;render()}document.getElementById('restart').onclick=reset;document.getElementById('again').onclick=reset;document.getElementById('home').onclick=reset;document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊':'🔇';if(soundOn)audio(660,.12)};render()})();
</script></body></html>
